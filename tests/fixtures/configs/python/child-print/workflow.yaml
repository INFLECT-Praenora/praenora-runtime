# fx-py-pool's children print a line in each tick: it reaches the tool's standard error, never its
# standard output, which carries the one JSON document of `praenora run --json`
# (PythonChildProcesses.ChildPrintAvoidsJsonOutput).
kind: workflow-config
format_version: "0.1.0"
workflow: { name: test.single, version: "0.1.0" }
run: { ticks: 2 }
inputs:
  source: { source: json-document, path: ../source.json }
steps:
  a:
    module: { name: fx-py-pool, version: "0.1.0" }
    parameters: { child_print: "fx-py-pool: a child printed this" }
